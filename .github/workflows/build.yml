name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      # Business Pack layout: athrill-target-v850e2m and athrill are sibling
      # checkouts, and CMake finds the core at ../athrill.
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          path: athrill-target-v850e2m

      - name: Select the Athrill branch
        id: athrill_ref
        run: |
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          if git ls-remote --exit-code --heads https://github.com/toppers/athrill.git "$BRANCH" > /dev/null; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=master" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout Athrill
        uses: actions/checkout@v4
        with:
          repository: toppers/athrill
          ref: ${{ steps.athrill_ref.outputs.ref }}
          path: athrill

      - name: Build and test
        working-directory: athrill-target-v850e2m
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build
          ctest --test-dir build --output-on-failure
