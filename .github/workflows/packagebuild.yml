name: package build

on:
  push:
    tags:
      - 'v*'
      - 'RC*'

permissions:
  contents: write

jobs:
  build-targets-job:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      # Business Pack layout: athrill-target-v850e2m and athrill are sibling
      # checkouts; CMake and E_PACKAGE both refer to ../athrill.
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          path: athrill-target-v850e2m
          fetch-depth: 0

      - name: Checkout Athrill
        uses: actions/checkout@v4
        with:
          repository: toppers/athrill
          path: athrill

      - name: Checkout toppers utils
        working-directory: athrill-target-v850e2m
        run: git clone https://github.com/mitsut/toppers_utils.git

      - name: Build athrill2
        working-directory: athrill-target-v850e2m
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          ./build/athrill2

      - name: Package (linux)
        if: matrix.os == 'ubuntu-latest'
        working-directory: athrill-target-v850e2m
        run: |
          mkdir -p build_linux
          cp build/athrill2 build_linux/
          perl toppers_utils/makerelease E_PACKAGE

      - name: Package (mac)
        if: matrix.os == 'macos-latest'
        working-directory: athrill-target-v850e2m
        run: |
          mkdir -p build_mac
          cp build/athrill2 build_mac/
          perl toppers_utils/makerelease E_PACKAGE.darwin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: athrill-targets-${{ matrix.os }}
          path: athrill-target-v850e2m/RELEASE/*.tar.gz

  MakeRelease:
    runs-on: ubuntu-latest
    needs: [build-targets-job]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get commit summary
        run: |
          PREVIOUS_TAG=$(git tag --sort=-creatordate | sed -n 2p)
          echo "PREVIOUS_TAG: $PREVIOUS_TAG"
          git log --oneline --pretty=tformat:"%h %s" "$PREVIOUS_TAG..${GITHUB_REF_NAME}" > RELEASE_NOTES.txt

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: athrill-targets
          merge-multiple: true

      - name: Display structure of downloaded files
        run: ls -R

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: RELEASE_NOTES.txt
          draft: true
          prerelease: true
          files: |
            ./athrill-targets/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
